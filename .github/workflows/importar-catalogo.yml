name: Importar el catálogo completo a este repositorio
on:
  push:
    paths:
      - '.github/workflows/importar-catalogo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar nuevo repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar proyecto original completo
        run: |
          git clone --depth=1 --branch main https://github.com/ZaidrakeOMG/Invitaciones-catalogo.git "$RUNNER_TEMP/catalogo-original"
          echo "Origen: $(git -C "$RUNNER_TEMP/catalogo-original" rev-parse --short HEAD)"
      - name: Copiar código, fotos, videos, portadas y configuraciones
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$RUNNER_TEMP/catalogo-original/" ./
          echo "Archivos copiados: $(find . -type f -not -path './.git/*' | wc -l)"
          test -f package.json
          test -f astro.config.mjs
          test -f public/data/catalogo-adicional.json
          test -f public/media/nfc-demostracion-sin-audio.mp4
          test -f src/pages/index.astro
          test -f src/styles/android-desktop-fit.css
      - name: Guardar el proyecto completo en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Importar proyecto completo de CAZAMI para Catalogo-alan-"
          git push origin HEAD:main
