name: Vaciar Catalogo-alan
on:
  push:
    paths:
      - '.github/workflows/vaciar-repositorio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Eliminar todos los archivos del proyecto, excepto workflows
        run: |
          set -euo pipefail
          git ls-files -z | grep -zv '^\.github/workflows/' | xargs -0 -r git rm --
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vaciar Catalogo-alan: retirar proyecto equivocado"
          git push origin HEAD:main
